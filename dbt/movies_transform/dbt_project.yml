name: 'movies_transform'
version: '1.0.0'
config-version: 2

profile: 'movies_transform_profile'

vars:
  # Data do snapshot da fonte de jogos (Kaggle, 22/dez/2016). Ano de lançamento
  # depois disso não é lançamento que já aconteceu.
  games_snapshot_year: 2016

models:
  movies_transform:
    trusted:
      +database: trusted
      +materialized: table
      +on_table_exists: replace
      movies:
        +schema: movies
      delivery:
        +schema: delivery
      games:
        +schema: games
    refined:
      +database: refined
      +materialized: table
      +on_table_exists: replace
      ml:
        +schema: ml
      games:
        +schema: games

seeds:
  +database: raw
  +schema: seed_data
  movies_transform:
    game_platforms:
      # "2600" (Atari) seria inferido como número; a chave é texto em toda a cadeia
      +column_types:
        platform_key: varchar
